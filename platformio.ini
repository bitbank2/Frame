; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c5-devkitc1-n8r4
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_qspi
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

; ── Static image from BfkLx0.h (original working firmware) ──────────────────
[env:default]
build_src_filter = +<*> -<img_fetch.cpp> -<main_TEST6_NEW_PCB_full1_wifi.cpp>

; ── WiFi image download test ─────────────────────────────────────────────────
[env:wifi]
build_src_filter = +<*> -<main_TEST6_NEW_PCB_full1.cpp>
build_flags =
    ${env.build_flags}
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=65536
lib_deps =
    bitbank2/PNGdec@^1.1.6
